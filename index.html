<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8" />
  </head>
  <body>
    <div class="matrix-info">
      <img src="./eisenhower-matrix.jpg" /><a
        class="matrix-info-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="todo-app">
      <p>
        <label for="new-task">Add Item</label
        ><span class="new-task-row"
          ><input id="new-task" class="task-text" type="text" /><button id="add-task">
            Add
          </button></span
        >
      </p>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li>
          <input type="checkbox" /><label class="task-text">Pay Bills</label
          ><input type="text" class="task-text" /><button class="edit-button">Edit</button
          ><button class="delete-button"><img src="./remove.svg" /></button>
        </li>
        <li class="edit-mode">
          <input type="checkbox" /><label class="task-text">Go Shopping</label
          ><input type="text" value="Go Shopping" class="task-text" /><button class="edit-button">
            Save</button
          ><button class="delete-button"><img src="./remove.svg" /></button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task-text">See the Doctor</label
          ><input type="text" class="task-text" /><button class="edit-button">Edit</button
          ><button class="delete-button"><img src="./remove.svg" /></button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
